<!doctype html>
<html lang="vi">
<head>
<script>
(function(){
  if (location.protocol === "file:") {
    window.addEventListener("DOMContentLoaded", function(){
      var box=document.createElement("div");
      box.style.cssText="position:fixed;inset:0;background:#020817;color:#fff;z-index:999999;display:flex;align-items:center;justify-content:center;font-family:Arial,sans-serif;padding:24px;box-sizing:border-box";
      box.innerHTML='<div style="max-width:620px;width:100%;background:#0b1730;border:1px solid #1677ff;border-radius:18px;padding:28px;box-shadow:0 0 40px rgba(0,110,255,.25);text-align:center">'+
        '<h2 style="margin:0 0 12px">⚠️ Hãy chạy CHAY_LAN.bat</h2>'+
        '<p style="color:#b8c7e6;line-height:1.6">Bạn đang mở <b>index.html</b> trực tiếp bằng file:/// nên API đăng nhập không chạy. Hãy đóng cửa sổ này và chạy <b>CHAY_LAN.bat</b> trong thư mục phần mềm.</p>'+
        '<p style="color:#65b8ff">Sau đó trình duyệt sẽ mở http://127.0.0.1:8000 và bạn đăng nhập bình thường.</p>'+
        '</div>';
      document.body.appendChild(box);
    });
  }
})();
</script>
